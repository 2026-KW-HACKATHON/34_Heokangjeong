    <radialGradient id="blue"><stop stop-color="#aad7e6" stop-opacity=".72"/><stop offset=".62" stop-color="#c4e4ed" stop-opacity=".48"/><stop offset="1" stop-color="#eaf4f6" stop-opacity="0"/></radialGradient>
  </defs>
  <path fill="#edf6f8" d="M0 0h1200v900H0z"/>
  <g filter="url(#wash)">
