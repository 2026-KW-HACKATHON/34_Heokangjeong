<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".009 .013" numOctaves="3" seed="24" result="cloud"/>
      <feDisplacementMap in="SourceGraphic" in2="cloud" scale="95"/>
