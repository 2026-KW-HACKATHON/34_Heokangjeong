    <ellipse cx="1060" cy="180" rx="470" ry="390" fill="url(#blue)"/>
    <ellipse cx="230" cy="690" rx="420" ry="350" fill="url(#blue)"/>
    <ellipse cx="1110" cy="800" rx="390" ry="310" fill="url(#blue)"/>
    <path d="M-50 390Q180 230 350 410T690 420T1250 400" fill="none" stroke="#fffdf7" stroke-width="130" opacity=".45"/>
  </g>
