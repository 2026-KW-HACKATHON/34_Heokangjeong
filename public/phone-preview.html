<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>WOLINK 휴대폰 화면 미리보기</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { display: flex; flex-direction: column; align-items: center; min-height: 100dvh; padding: 12px; background: #e8e9ec; color: #24272b; font: 14px/1.4 system-ui, sans-serif; }
    .toolbar { display: flex; align-items: center; gap: 12px; min-height: 36px; margin-bottom: 12px; }
    .toolbar strong { font-size: 13px; }
    select { padding: 6px 9px; border: 1px solid #c7cbd1; border-radius: 8px; background: #fff; font: inherit; }
    .stage { position: relative; flex: none; }
    .phone { position: absolute; top: 0; left: 0; overflow: hidden; border: 5px solid #25282e; border-radius: 36px; background: #f5f5f7; box-shadow: 0 18px 48px #1c202635; transform-origin: top left; }
    iframe { display: block; width: 100%; height: 100%; border: 0; border-radius: 30px; background: #f5f5f7; }
    .note { margin: 11px 0 0; color: #656a72; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <div class="toolbar">
    <strong>휴대폰 화면 미리보기</strong>
    <label>화면 크기 <select id="device">
      <option value="390x844">390 × 844</option>
      <option value="360x800">360 × 800</option>
      <option value="393x852">393 × 852</option>
    </select></label>
  </div>
  <div class="stage" id="stage"><div class="phone" id="phone"><iframe id="app" title="WOLINK 앱 화면"></iframe></div></div>
  <p class="note">화면을 누르거나 스크롤해 실제 앱처럼 확인할 수 있습니다.</p>
  <script>
    const params = new URLSearchParams(location.search);
    const requested = params.get('path') || '/';
    document.getElementById('app').src = requested.startsWith('/') && !requested.startsWith('//') ? requested : '/';
    const select = document.getElementById('device');
    const stage = document.getElementById('stage');
    const phone = document.getElementById('phone');
    function sizePhone() {
      const [width, height] = select.value.split('x').map(Number);
      const scale = Math.min(1, (innerWidth - 24) / (width + 10), (innerHeight - 100) / (height + 10));
      phone.style.width = `${width + 10}px`;
      phone.style.height = `${height + 10}px`;
      phone.style.transform = `scale(${Math.max(.2, scale)})`;
      stage.style.width = `${(width + 10) * scale}px`;
      stage.style.height = `${(height + 10) * scale}px`;
    }
    select.addEventListener('change', sizePhone);
    addEventListener('resize', sizePhone);
    sizePhone();
  </script>
</body>
</html>
